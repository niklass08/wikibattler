<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A trading-card game built on Wikipedia. Every article is a card." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0b'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Georgia,serif' text-anchor='middle' fill='%23ededef'%3EW%3C/text%3E%3C/svg%3E"
    />
    <title>WikiTCG</title>
  </head>
  <body>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        color: #5a5a63;
        font: 600 14px/1 'Inter', system-ui, sans-serif;
        letter-spacing: 0.02em;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
    <div id="boot">WikiTCG</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
